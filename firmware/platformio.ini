; Bomb cube firmware: 3 ESP32-S3-DevKitC-1 N16R8, one env per board.
; Build all: pio run. Upload: pio run -e board-a -t upload --upload-port COM5.

[env]
platform = platformio/espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
debug_tool = esp-builtin
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
build_src_flags =
    -Wall
    -Wextra
; Pinned versions: the HUB75 registry 3.0.14 has a row-scanning bug, 3.0.15 fixes it.
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15

[env:board-a]
build_src_filter = +<Board1/>

[env:board-b]
build_src_filter = +<Board2/>
