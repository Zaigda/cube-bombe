; Bomb cube — ESP32-S3 Super Mini firmware
; Based on the course's platformio.ini (Day 2 + "ESP32 · Bases"), split into environments.
;
;   usb-jtag : normal mode (serial monitor, auto upload, JTAG debugging)  <- default
;   usb-otg  : the board becomes a USB keyboard / gamepad / mouse (HID)
;
; Switch environment: env selector in the IDE, or `pio run -e usb-otg -t upload`.

[platformio]
default_envs = usb-jtag

; ---------- shared settings (not an environment) ----------
[esp32s3]
platform = platformio/espressif32@7.1.3     ; pinned: Arduino-ESP32 2.0.17, same version for everyone
board = esp32-s3-devkitc-1                  ; same chip as the Super Mini
framework = arduino

board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; crash -> file:line

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1             ; Serial = USB serial port
    -DCORE_DEBUG_LEVEL=3                    ; log_e / log_w / log_i

lib_deps =
    adafruit/Adafruit NeoPixel

; ---------- normal mode ----------
[env:usb-jtag]
extends = esp32s3
build_flags =
    ${esp32s3.build_flags}
    -DARDUINO_USB_MODE=1
debug_tool = esp-builtin

; ---------- HID mode (keyboard, gamepad, mouse) ----------
[env:usb-otg]
extends = esp32s3
build_flags =
    ${esp32s3.build_flags}
    -DARDUINO_USB_MODE=0
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
board_upload.after_reset = watchdog_reset
