; Bomb cube firmware: ESP32-S3-DevKitC-1 N16R8 inside the cube, with the LED panels and buttons.
; Upload: `pio run -t upload`. Always plug the board's native USB port (the one labelled "USB").

[platformio]
default_envs = cube

[env:cube]
platform = platformio/espressif32@7.1.3     ; pinned: Arduino-ESP32 2.0.17, same for everyone
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; 16 MB flash + 8 MB octal PSRAM (uses GPIO 35-37)

monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; crash -> file:line
debug_tool = esp-builtin                    ; step-by-step debugging through the USB port

build_unflags = -std=gnu++11                ; Arduino-ESP32 2.0.17 defaults to C++11...
build_flags =
    -std=gnu++17                            ; ...we want C++17
    -DARDUINO_USB_MODE=1                    ; native USB port: upload + serial monitor
    -DARDUINO_USB_CDC_ON_BOOT=1             ; Serial goes through that USB port
    -DBOARD_HAS_PSRAM

; Pinned versions: the HUB75 registry 3.0.14 has a row-scanning bug, 3.0.15 fixes it.
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15
