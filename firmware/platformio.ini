; Bomb cube firmware.
;
; Environments (env selector in the IDE, or `pio run -e cube -t upload`):
;   home : ESP32-S3 Super Mini, no panel and no sensor. Screens are drawn as text
;          in the serial monitor, sensors are replaced by keys typed in the monitor.
;   cube : ESP32-S3-DevKitC-1 N16R8 inside the cube, with the real LED panels and sensors.
;
; Both boards have the same chip, so the game code is identical: only the memory
; settings below and the objects created in main.cpp (CUBE_HARDWARE) differ.
; Always plug the board's native USB port (the one labelled "USB" on the DevKitC).

[platformio]
default_envs = home

; ---------- shared by every environment ----------
[env]
platform = platformio/espressif32@7.1.3     ; pinned: Arduino-ESP32 2.0.17, same for everyone
board = esp32-s3-devkitc-1                  ; generic ESP32-S3 board, memory adjusted per env
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; crash -> file:line
debug_tool = esp-builtin                    ; step-by-step debugging through the USB port

build_unflags = -std=gnu++11                ; Arduino-ESP32 2.0.17 defaults to C++11...
build_flags =
    -std=gnu++17                            ; ...we want C++17
    -DARDUINO_USB_MODE=1                    ; native USB port: upload + serial monitor
    -DARDUINO_USB_CDC_ON_BOOT=1             ; Serial goes through that USB port
    -DBOARD_HAS_PSRAM

; Pinned versions: the HUB75 registry 3.0.14 has a row-scanning bug, 3.0.15 fixes it.
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15

; ---------- Super Mini, at home ----------
[env:home]
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi  ; 4 MB flash + 2 MB quad PSRAM

; ---------- DevKitC-1 N16R8, in the cube ----------
[env:cube]
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; 16 MB flash + 8 MB octal PSRAM (uses GPIO 35-37)
build_flags =
    ${env.build_flags}
    -DCUBE_HARDWARE                         ; main.cpp creates the real panels and sensors
